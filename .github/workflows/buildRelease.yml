# Build Release - Builds a numbered release as Docker images and pushes to ECR.
#
# Manually triggered from the master branch. Validates the version input, builds both
# nginx and tomcat images in parallel, pushes them to ECR, tags the commit, and creates
# a GitHub release with auto-generated notes. For snapshot builds, see Build Snapshot.

name: Build Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release Version (e.g. 9.0.0)'
                required: true
                type: string

# Run all release builds one-by-one, but never cancel a release build due to another one.
concurrency:
    group: build-release
    cancel-in-progress: false

env:
    TOMCAT_IMAGE: xh/toolbox-tomcat
    NGINX_IMAGE: xh/toolbox-nginx

jobs:
    validate:
        # Releases are always cut from master, which tracks the last released code. This guards
        # against an accidental release from develop (which carries unreleased SNAPSHOT work) or
        # any other branch.
        if: github.ref == 'refs/heads/master'

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v6
          with:
              fetch-depth: 0
              fetch-tags: true

        # Checkout is required to be called with `fetch-depth: 0` and `fetch-tags: true`.
        - name: Validate release version
          uses: xh/hoist-dev-utils/.github/actions/validate-release-version@master
          with:
              version: ${{ inputs.version }}

        # A release must ship released Hoist libraries. A missed swap still builds clean. pnpm
        # installs the snapshot that the lockfile holds for `next`, and a stale gradle.lockfile
        # overrides a lower hoistCoreVersion. So this step requires an exact release for each
        # library, and a gradle.lockfile that locks the declared hoist-core version.
        - name: Check release-pinned Hoist libraries
          run: |
              release_re='^[0-9]+\.[0-9]+\.[0-9]+$'
              failed=0

              for pkg in @xh/hoist @xh/hoist-dev-utils; do
                  spec=$(jq -r --arg p "$pkg" '.dependencies[$p] // .devDependencies[$p] // "missing"' client-app/package.json)
                  if [[ ! "$spec" =~ $release_re ]]; then
                      echo "::error file=client-app/package.json::$pkg is '$spec', not an exact release version."
                      failed=1
                  fi
              done

              core=$(grep '^hoistCoreVersion=' gradle.properties | cut -d= -f2- | tr -d '[:space:]' || true)
              if [[ ! "$core" =~ $release_re ]]; then
                  echo "::error file=gradle.properties::hoistCoreVersion is '$core', not an exact release version."
                  failed=1
              elif ! awk -F= -v want="io.xh:hoist-core:$core" '$1 == want {found=1} END {exit !found}' gradle.lockfile; then
                  locked=$(grep '^io.xh:hoist-core:' gradle.lockfile | cut -d= -f1 || true)
                  echo "::error file=gradle.lockfile::gradle.lockfile locks '${locked:-no hoist-core}', not io.xh:hoist-core:$core. Run ./gradlew dependencies --write-locks -PrunHoistInline=false and commit the result."
                  failed=1
              fi

              exit $failed

    prepare:
        needs: validate

        runs-on: ubuntu-latest
        permissions: {}
        outputs:
            build-tag: ${{ steps.tag.outputs.build-tag }}
        steps:
        - name: Generate build tag
          id: tag
          run: echo "build-tag=${GITHUB_SHA::7}_${GITHUB_REF_NAME}_$(date -u +'%Y-%m-%dT%H:%MZ')" >> "$GITHUB_OUTPUT"

    build-tomcat:
        needs: prepare

        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
        - uses: actions/checkout@v6

        - name: Setup JDK 25
          uses: actions/setup-java@v5
          with:
              java-version: '25'
              distribution: 'temurin'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6
          with:
              build-scan-publish: false
              build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
              build-scan-terms-of-use-agree: 'yes'

        - name: Build WAR
          env:
              VERSION: ${{ inputs.version }}
          run: ./gradlew -PxhAppVersion="$VERSION" -PxhAppBuild="${{ needs.prepare.outputs.build-tag }}" war

        - name: Copy WAR into Docker context
          run: cp build/libs/*.war docker/tomcat/app.war

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
              role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/xh-github-actions-deploy
              aws-region: ${{ secrets.AWS_REGION }}

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build and push tomcat image
          env:
              ECR_ROOT: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
              VERSION: ${{ inputs.version }}
          run: |
              docker build -t "$ECR_ROOT/${{ env.TOMCAT_IMAGE }}:$VERSION" \
                           -t "$ECR_ROOT/${{ env.TOMCAT_IMAGE }}:latest" \
                           docker/tomcat
              docker push "$ECR_ROOT/${{ env.TOMCAT_IMAGE }}:$VERSION"
              docker push "$ECR_ROOT/${{ env.TOMCAT_IMAGE }}:latest"

    build-nginx:
        needs: prepare

        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
        - uses: actions/checkout@v6

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version-file: 'client-app/.nvmrc'

        # Installs the pnpm version pinned via the packageManager field in package.json.
        - name: Setup pnpm
          uses: pnpm/setup@v2
          with:
              package-json-file: 'client-app/package.json'
              # `install: false` - this workflow runs its own install step below, after
              # registry auth and store-cache restore, and with the lockfile flags it wants.
              install: false

        # Cache the pnpm store directly (rather than via setup-node's
        # `cache: pnpm`, which keys strictly on the lockfile hash with no fallback).
        # The `restore-keys` prefix lets a lockfile-changed run restore the most
        # recent prior cache, so `pnpm install` only downloads packages that
        # actually moved - important given the FontAwesome Pro bandwidth cap.
        - name: Resolve pnpm store directory
          id: pnpm-store-dir
          run: echo "dir=$(cd client-app && pnpm store path)" >> "$GITHUB_OUTPUT"

        - name: Restore pnpm store
          uses: actions/cache@v5
          with:
              path: ${{ steps.pnpm-store-dir.outputs.dir }}
              key: pnpm-${{ runner.os }}-${{ hashFiles('client-app/pnpm-lock.yaml') }}
              restore-keys: |
                  pnpm-${{ runner.os }}-

        - name: Configure Font Awesome registry auth
          env:
              FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          run: echo "//npm.fontawesome.com/:_authToken=$FONTAWESOME_PACKAGE_TOKEN" >> client-app/.npmrc

        # `pnpm typecheck` is a distinct gate from `pnpm lint` - linting never reports TypeScript
        # compiler errors. Both run here, so the release build type-checks the app against the
        # exact `@xh/hoist` version it ships with.
        - name: Install dependencies, test, and build client app
          env:
              VERSION: ${{ inputs.version }}
          run: cd client-app && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && XH_APP_VERSION="$VERSION" XH_APP_BUILD="${{ needs.prepare.outputs.build-tag }}" pnpm build

        - name: Copy client build into Docker context
          run: cp -r client-app/build/ docker/nginx/build/

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
              role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/xh-github-actions-deploy
              aws-region: ${{ secrets.AWS_REGION }}

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build and push nginx image
          env:
              ECR_ROOT: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
              VERSION: ${{ inputs.version }}
          run: |
              docker build -t "$ECR_ROOT/${{ env.NGINX_IMAGE }}:$VERSION" \
                           -t "$ECR_ROOT/${{ env.NGINX_IMAGE }}:latest" \
                           docker/nginx
              docker push "$ECR_ROOT/${{ env.NGINX_IMAGE }}:$VERSION"
              docker push "$ECR_ROOT/${{ env.NGINX_IMAGE }}:latest"

    release:
        needs: [ build-tomcat, build-nginx ]

        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
        - uses: actions/checkout@v6
          with:
              fetch-depth: 0
              fetch-tags: true

        # Note: The tag intentionally points to a commit where gradle.properties still has
        # the SNAPSHOT version. We chose not to commit the version change back to the repo to
        # avoid paired set/reset commits on every release. The built WAR artifact has the
        # correct release version - the tag is just a pointer to the source commit.
        # Checkout is required to be called with `fetch-depth: 0` and `fetch-tags: true`.
        - name: Create tag and GitHub release
          uses: xh/hoist-dev-utils/.github/actions/create-tag-and-github-release@master
          with:
              version: ${{ inputs.version }}
          env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}