# CI — Validates builds on PRs and pushes to develop, and submits the dependency
# graph to GitHub for Dependabot vulnerability alerts.
#
# This workflow does not publish artifacts. For snapshot and release Docker builds,
# see Build Snapshot and Build Release.

name: CI

on:
    push:
        branches: [ "develop" ]
    pull_request:
        branches: [ "develop" ]

jobs:
    build:

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v6
        - name: Setup JDK 21
          uses: actions/setup-java@v5
          with:
              java-version: '21'
              distribution: 'temurin'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6
          with:
              build-scan-publish: false
              build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
              build-scan-terms-of-use-agree: 'yes'

        - name: Build with Gradle Wrapper
          run: ./gradlew build

    lint:

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v6

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version-file: 'client-app/.nvmrc'

        # Installs the pnpm version pinned via the packageManager field in package.json.
        - name: Setup pnpm
          uses: pnpm/action-setup@v4
          with:
              package_json_file: 'client-app/package.json'

        # Cache the pnpm store directly (rather than via setup-node's
        # `cache: pnpm`, which keys strictly on the lockfile hash with no fallback).
        # The `restore-keys` prefix lets a lockfile-changed run restore the most
        # recent prior cache, so `pnpm install` only downloads packages that
        # actually moved - important given the FontAwesome Pro bandwidth cap.
        - name: Resolve pnpm store directory
          id: pnpm-store-dir
          run: echo "dir=$(cd client-app && pnpm store path)" >> "$GITHUB_OUTPUT"

        - name: Restore pnpm store
          uses: actions/cache@v5
          with:
              path: ${{ steps.pnpm-store-dir.outputs.dir }}
              key: pnpm-${{ runner.os }}-${{ hashFiles('client-app/pnpm-lock.yaml') }}
              restore-keys: |
                  pnpm-${{ runner.os }}-

        - name: Configure Font Awesome registry auth
          env:
              FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          run: echo "//npm.fontawesome.com/:_authToken=$FONTAWESOME_PACKAGE_TOKEN" >> client-app/.npmrc

        - name: Install dependencies
          run: cd client-app && pnpm install --frozen-lockfile

        - name: Lint
          run: cd client-app && pnpm lint

    dependency-submission:

        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
        - uses: actions/checkout@v6
        - name: Setup JDK 21
          uses: actions/setup-java@v5
          with:
              java-version: '21'
              distribution: 'temurin'

        # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
        # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
        - name: Generate and submit dependency graph
          uses: gradle/actions/dependency-submission@v6
          with:
              build-scan-publish: false
              build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
              build-scan-terms-of-use-agree: 'yes'
