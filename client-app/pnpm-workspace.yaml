# pnpm settings (pnpm 11+ reads these from this file, not from a `pnpm` field in package.json).
# This is a single-package project - the file exists for settings only, not to define a workspace.

# Dependency build scripts do not run unless reviewed here; unreviewed scripts are a hard error
# in CI. esbuild is allowed so its platform binary install is guaranteed for build tooling. The
# rest are declined: the @ibm/plex packages ship static font files, browser-tabs-lock (via
# auth0-spa-js) ships prebuilt dist, and core-js's postinstall only prints a funding message.
allowBuilds:
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@parcel/watcher': false
  browser-tabs-lock: false
  core-js: false
  esbuild: true

# The build toolchain is owned by @xh/hoist-dev-utils, which depends on @rsbuild/core and drives it
# from its `configureRsbuild` export. Our `build` / `start` scripts invoke the `rsbuild` CLI by
# name, but pnpm only links bins for direct dependencies - so hoist it into the app's node_modules to
# put `rsbuild` on the script PATH. Preferred over re-declaring it as a direct devDependency of the
# app: that would fork the version from whatever dev-utils resolves, silently yielding two Rsbuild
# copies (the CLI's and the one dev-utils loads its plugins against) on any future dev-utils bump.
publicHoistPattern:
  - '@rsbuild/core'

# pnpm's minimum-release-age gate refuses freshly published versions as supply-chain protection.
# Exempt XH's own packages - hoist-react and hoist-dev-utils SNAPSHOTs are routinely consumed
# minutes after publish.
minimumReleaseAgeExclude:
  - '@xh/*'
  - eslint@10.9.1

# Keep pnpm-lock.yaml a single YAML document. By default pnpm 12 records the pinned pnpm version in
# a leading lockfile document, and GitHub's dependency graph reads only that first document - so it
# sees none of our real deps and Dependabot raises no security alerts. With `ignore`, pnpm runs
# whatever version is installed rather than switching to the `packageManager` pin. CI still installs
# the pinned version via pnpm/setup. Remove once GitHub parses multi-document lockfiles - see
# https://github.com/dependabot/dependabot-core/issues/15904.
pmOnFail: ignore

overrides:
  # Rspack 2.3.2 and 2.3.3 have SWC minifier bugs that break production builds when
  # `keep_classnames` is set, as hoist-dev-utils does. 2.3.2 emits invalid static class
  # self-references, e.g. Blueprint's NumericInput throws a TDZ ReferenceError on load. 2.3.3 gives
  # a local the same name as a kept class name, which leaves Highcharts charts blank. This must be an
  # app-level override: Rsbuild's own range would otherwise resolve a broken version. Remove once a
  # fixed Rspack ships - see https://github.com/web-infra-dev/rspack/issues/16695 and
  # https://github.com/xh/hoist-dev-utils/issues/85.
  '@rspack/core': 2.3.1

# Several transitive deps (react-popper, react-onsenui, react-windowed-select)
# still declare react/react-dom peer ranges capped at 18. The app runs React 19 per hoist-react
# v87 - acknowledge that here rather than surfacing unmet-peer warnings on every install.
# Vitest's mocker declares an msw 2 peer, but only Vitest's browser mode uses it there. Unit tests
# run on msw 3, as hoist-react's test kit requires.
peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    '@vitest/mocker>msw': '3'
